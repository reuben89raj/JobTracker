<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOE Opportunity Tracker</title>
  <link rel="stylesheet" href="/foundation.min.css?v=1">
  <link rel="stylesheet" href="/styles.css?v=foundation-clean-1">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow">REUBEN SAMSON RAJ - DOE LAB CAREERS</p>
        <h1>Opportunity tracker</h1>
        <p>Computing-focused research roles, with your application pipeline in one place.</p>
      </div>
      <div class="app-menu">
        <button id="menu-toggle" class="icon-button" type="button" aria-expanded="false" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
        <div id="menu-panel" class="menu-panel" hidden>
          <button id="refresh-csv" type="button">Refresh CSV</button>
          <a id="download-csv" href="/api/download-csv">Download CSV</a>
          <button id="view-discards" type="button">View discard pile</button>
        </div>
      </div>
    </header>

    <section id="summary" class="summary"></section>
    <section id="source-health" class="source-health"></section>

    <section class="filters">
      <input id="search" type="search" placeholder="Search title, lab, location, or keywords">
      <select id="company"><option value="all">All companies</option></select>
      <select id="source-status">
        <option value="open">Open postings</option>
        <option value="closed">Closed postings</option>
        <option value="all">All source statuses</option>
      </select>
      <select id="personal-status">
        <option value="all">All personal statuses</option>
        <option value="untracked">Untracked</option>
        <option value="applied">Applied</option>
        <option value="in_progress">In progress</option>
        <option value="not_proceeding">Not proceeding</option>
      </select>
    </section>

    <p id="result-count" class="result-count"></p>

    <section class="workspace">
      <section id="jobs" class="jobs"></section>
      <aside id="detail-pane" class="detail-pane">
        <div class="empty-detail">
          <span>&lt;-</span>
          <p>Select a posting to view details.</p>
        </div>
      </aside>
    </section>
  </main>

  <template id="listing-template">
    <button class="job-listing" type="button">
      <div>
        <p class="lab"></p>
        <h2></h2>
        <p class="meta"></p>
      </div>
      <span class="source-badge"></span>
    </button>
  </template>

  <template id="detail-template">
    <article class="job-detail">
      <button class="close-detail" type="button">x</button>
      <div class="detail-heading">
        <p class="lab"></p>
        <h2></h2>
        <p class="meta"></p>
        <span class="source-badge"></span>
      </div>
      <div class="detail-actions">
        <a class="apply-link" target="_blank" rel="noreferrer">Open official posting -&gt;</a>
        <div class="status-controls">
          <select class="personal-select">
            <option value="untracked">Untracked</option>
            <option value="applied">Applied</option>
            <option value="in_progress">In progress</option>
            <option value="not_proceeding">Not proceeding</option>
            <option value="na">NA</option>
          </select>
          <button class="save-button button">Save</button>
        </div>
      </div>
      <textarea class="notes" rows="3" placeholder="Private notes: recruiter, deadline, follow-up..."></textarea>
      <p class="evidence"></p>
      <section class="job-sections"></section>
      <details class="full-description">
        <summary>Full cleaned description</summary>
        <div class="description"></div>
      </details>
    </article>
  </template>

  <section id="discard-modal" class="modal-backdrop" hidden>
    <article class="discard-panel">
      <button id="close-discards" class="close-detail" type="button">x</button>
      <p class="eyebrow">DISCARD PILE</p>
      <h2>Jobs marked NA</h2>
      <div id="discard-list" class="discard-list"></div>
    </article>
  </section>

  <script src="/app.js"></script>
</body>
</html>
